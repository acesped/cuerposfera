name: CUERPOSFERA Instagram
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run para probar, publish para enviar a Instagram"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish]
permissions:
  contents: write
concurrency:
  group: cuerposfera-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      IG_EXPECTED_USERNAME: cuerposfera
      IG_GRAPH_VERSION: v25.0
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      STATE_BRANCH: cuerposfera-state
      OUTPUT_DIR: output
      ENABLE_MUSIC: 'true'
      PUBLISH_FEED: 'true'
      PUBLISH_STORY: 'true'
      REEL_MUSIC_URL: https://commons.wikimedia.org/wiki/Special:Redirect/file/Promise.ogg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install multimedia tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Check prerequisites
        run: python monitor.py --check
      - name: Run CUERPOSFERA
        shell: bash
        run: |
          if [[ "${{ inputs.mode }}" == "publish" ]]; then
            python monitor.py --publish
          else
            python monitor.py --dry-run
          fi
      - name: Upload preview and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuerposfera-output-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 7
