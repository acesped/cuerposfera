name: CUERPOSFERA Instagram

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Comprobar, previsualizar o publicar"
        required: true
        default: check-instagram
        type: choice
        options:
          - check-instagram
          - dry-run
          - publish

permissions:
  contents: write

concurrency:
  group: cuerposfera-instagram
  cancel-in-progress: false

jobs:
  cuerposfera:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      IG_EXPECTED_USERNAME: cuerposfera
      IG_GRAPH_VERSION: v25.0
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: openrouter/free
      STATE_BRANCH: cuerposfera-state
      OUTPUT_DIR: output
      ENABLE_PHOTOS: "true"
      ENABLE_MUSIC: "true"
      REQUIRE_VOICE: "true"
      PUBLISH_FEED: "true"
      PUBLISH_STORY: "true"
      REEL_MUSIC_URL: https://commons.wikimedia.org/wiki/Special:Redirect/file/Promise.ogg

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar FFmpeg y fuentes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Instalar requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar proyecto
        run: |
          test -f monitor.py || { echo "ERROR: falta monitor.py en la raiz del repositorio"; exit 1; }
          python -m py_compile monitor.py
          python monitor.py --check

      - name: Comprobar que token e ID apuntan a CUERPÓSFERA
        if: ${{ inputs.mode == 'check-instagram' || inputs.mode == 'publish' }}
        run: python monitor.py --check-instagram

      - name: Generar vista previa o publicar
        if: ${{ inputs.mode == 'dry-run' || inputs.mode == 'publish' }}
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [[ "$MODE" == "publish" ]]; then
            python monitor.py --publish
          else
            python monitor.py --dry-run
          fi

      - name: Guardar archivos de salida
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cuerposfera-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 7
