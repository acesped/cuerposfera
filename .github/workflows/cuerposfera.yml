name: CUERPOSFERA Instagram
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run o publish"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish]
permissions:
  contents: write
concurrency:
  group: cuerposfera-ig
  cancel-in-progress: false
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      IG_EXPECTED_USERNAME: cuerposfera
      IG_GRAPH_VERSION: v25.0
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: openrouter/free
      STATE_BRANCH: cuerposfera-state
      OUTPUT_DIR: output
      ENABLE_PHOTOS: 'true'
      ENABLE_MUSIC: 'true'
      REQUIRE_VOICE: 'true'
      PUBLISH_FEED: 'true'
      PUBLISH_STORY: 'true'
      REEL_MUSIC_URL: https://commons.wikimedia.org/wiki/Special:Redirect/file/Promise.ogg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python requirements
        run: pip install -r requirements.txt
      - name: Verify
        run: python monitor.py --check
      - name: Generate or publish
        shell: bash
        run: |
          if [[ "${{ inputs.mode }}" == "publish" ]]; then
            python monitor.py --publish
          else
            python monitor.py --dry-run
          fi
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuerposfera-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 7
